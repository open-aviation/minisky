[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "pyright>=1.1.390",
    "fakeredis>=2.26",
]
docs = ["zensical>=0.0.47", "mkdocstrings-python>=2.0.5"]

[tool.pytest.ini_options]
testpaths = [
    "packages/minisky/tests",
    "packages/minisky-example/tests",
    "packages/minisky-example-customautopilot/tests",
    "packages/minisky-multicopter/tests",
    "packages/minisky-tangram/tests",
]
pythonpath = [".", "packages/minisky"]
addopts = "-ra -m 'not api'"
markers = ["api: FastAPI endpoint tests, run separately with just test-api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "NPY",
    "PT",
    "A", # shadowing
    "PTH", # prefer pathlib over os.path and built-in open()
    "RUF006", # keep references to created asyncio tasks
    "RUF021", # parenthesize mixed and/or expressions
]

[tool.pyright]
include = [
    "packages/minisky/minisky",
    "packages/minisky-example*/src",
    "packages/minisky-multicopter/src",
    "packages/minisky-tangram/src",
    "packages/tangram-minisky/src",
    "packages/*/tests",
]
exclude = [
    "**/.*",
    "**/__pycache__",
    "**/node_modules",
    ".venv",
    "build",
    "site",
    # TODO(abraham): these files will need extensive typing, deferring for now
    "packages/minisky/tests/unit/test_aero.py",
    "packages/minisky/tests/unit/test_detection.py",
]
extraPaths = [
    "packages/minisky",
    "packages/minisky-example/src",
    "packages/minisky-example-customautopilot/src",
    "packages/minisky-multicopter/src",
    "packages/minisky-tangram/src",
    "packages/tangram-minisky/src",
]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# in isqx, we don't want to force people to annotate `[float]` or `[np.ndarray]`
# see https://github.com/open-aviation/minisky/issues/38#issuecomment-5156669559.
reportMissingTypeArgument = false
# passing `value: q.DistanceM` to NumPy intentionally propagates its unknown carrier.
reportUnknownArgumentType = false
# numPy overloads such as `np.where(..., q.DistanceM, ...)` can be partially unknown.
reportUnknownMemberType = false
# `value: q.DistanceM` intentionally leaves the underlying Python carrier unknown.
reportUnknownParameterType = false
# Results derived from an unspecialized `q.DistanceM` may retain an unknown carrier.
reportUnknownVariableType = false
# something to do with pandas, maybe we should investigate?
reportMissingTypeStubs = false

# the following are used to supress pyright temporarily
# they are scheduled for removal in a future PR.

# a few dynamically-typed callbacks still leave lambda parameter/result types unknown.
reportUnknownLambdaType = false
# some legacy helpers still have truly unannotated non-physical parameters such as `dict` data.
reportMissingParameterType = false
# cooperating traffic/plugin classes still access framework internals such as `_children`.
reportPrivateUsage = false
reportUnnecessaryIsInstance = false
reportConstantRedefinition = false
