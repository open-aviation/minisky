[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=9.1.1",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "fakeredis>=2.26",
]
docs = [
    "zensical>=0.0.47",
    "mkdocstrings-python>=2.0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages/minisky"]
addopts = "-ra -m 'not api'"
markers = [
    "api: FastAPI endpoint tests, run separately with just test-api",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade,
# B: flake8-bugbear, SIM: flake8-simplify, C4: flake8-comprehensions,
# DTZ: flake8-datetimez (no naive datetimes; sim.utc is timezone-aware UTC)
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "DTZ"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI relies on function calls (Depends/File) in argument defaults
    "E711",   # `== None` on numpy arrays is elementwise, not equivalent to `is None`
    "E712",   # `== True/False` on numpy arrays is elementwise and intentional
    "E721",   # `type(x) == y` comparisons are intentional in a few numeric paths
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
"packages/minisky/minisky/plugin/*.py" = ["F401"]  # plugin API surface re-exports

[tool.ruff.lint.isort]
known-first-party = ["minisky", "example_plugins", "tests"]

[tool.pyright]
include = [
    "packages/minisky/minisky",
    "packages/minisky/example_plugins",
    "packages/tangram-minisky/src",
    "tests",
]
exclude = [
    "**/.*", "**/__pycache__", "**/node_modules", ".venv", "build", "site",
    # TODO(abraham): these files will need extensive typing, deferring for now
    "tests/unit/test_aero.py", "tests/unit/test_detection.py"
]
extraPaths = ["packages/minisky", "packages/tangram-minisky/src"]
pythonVersion = "3.11"
# "standard" catches useful bugs while staying practical for this numpy/scipy-heavy fork.
typeCheckingMode = "standard"
# Fully-typed files where any leftover implicit Any should be an error.
strict = ["packages/minisky/example_plugins/*.py"]
reportMissingTypeStubs = false
reportWildcardImportFromLibrary = false
