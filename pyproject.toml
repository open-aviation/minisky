[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "pyright>=1.1.390",
    "fakeredis>=2.26",
]
docs = ["zensical>=0.0.47", "mkdocstrings-python>=2.0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages/minisky"]
addopts = "-ra -m 'not api'"
markers = ["api: FastAPI endpoint tests, run separately with just test-api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "NPY",
    "PT",
    "A", # shadowing
    "PTH", # prefer pathlib over os.path and built-in open()
    "RUF006", # keep references to created asyncio tasks
    "RUF021", # parenthesize mixed and/or expressions
]

[tool.pyright]
include = [
    "packages/minisky/minisky",
    "packages/minisky-example*/src",
    "packages/minisky-tangram/src",
    "packages/tangram-minisky/src",
    "tests",
]
exclude = [
    "**/.*",
    "**/__pycache__",
    "**/node_modules",
    ".venv",
    "build",
    "site",
    # TODO(abraham): these files will need extensive typing, deferring for now
    "tests/unit/test_aero.py",
    "tests/unit/test_detection.py",
]
extraPaths = [
    "packages/minisky",
    "packages/minisky-example/src",
    "packages/minisky-example-customautopilot/src",
    "packages/minisky-tangram/src",
    "packages/tangram-minisky/src",
]
pythonVersion = "3.11"
# "standard" catches useful bugs while staying practical for this numpy/scipy-heavy fork.
typeCheckingMode = "standard"
# Fully-typed files where any leftover implicit Any should be an error.
strict = [
    "packages/minisky-example*/src/**/*.py",
    "packages/minisky-tangram/src/**/*.py",
]
reportMissingTypeStubs = false
reportWildcardImportFromLibrary = false
