[project]
site_name = "MiniSky"
site_description = "A minimal command line air traffic simulator with REST API (a BlueSky fork)"
repo_url = "https://github.com/open-aviation/minisky"
repo_name = "open-aviation/minisky"
watch = ["packages/minisky/minisky"]
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guides" = [
    { "Configuration" = "guides/configuration.md" },
    { "Command-line interface" = "guides/cli.md" },
    { "Running scenarios" = "guides/running-scenarios.md" },
    { "Control console" = "guides/console.md" },
    { "Writing plugins" = "guides/plugins.md" },
    { "Adding Commands" = "guides/commands.md" },
    { "Flying multicopters" = "guides/multicopters.md" },
  ] },
  { "Reference" = [
    { "Stack commands" = "reference/commands.md" },
    { "API" = [
      { "minisky" = "api/minisky.md" },
      { "quantities" = "api/quantities.md" },
      { "values" = "api/values.md" },
      { "simulation" = "api/simulation.md" },
      { "traffic" = "api/traffic.md" },
      { "stack" = "api/stack.md" },
      { "plugin" = "api/plugin.md" },
      { "core" = "api/core.md" },
      { "tools" = "api/tools.md" },
      { "multicopter" = "api/multicopter.md" },
      { "tangram_minisky" = "api/tangram-minisky.md" },
    ] },
  ] },
]
extra_javascript = [
  "assets/js/katex.js",
  "https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js",
  "https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/contrib/auto-render.min.js",
  "https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/contrib/copy-tex.min.js",
]
extra_css = [
  "https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css",
]

[project.theme]
features = [
  "navigation.sections",
  "navigation.top",
  "content.code.copy",
  "search.suggest",
]

[project.theme.icon]
logo = "material/airplane"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue grey"
accent = "indigo"

[project.theme.palette.toggle]
icon = "material/weather-night"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue grey"
accent = "indigo"

[project.theme.palette.toggle]
icon = "material/weather-sunny"
name = "Switch to light mode"

[project.plugins]
search = {}

[project.plugins.mkdocstrings]
enable_inventory = true

[project.plugins.mkdocstrings.handlers.python]
# tangram_minisky lives in its own workspace and is not installed in the docs
# environment; point griffe at its source so it can analyse it statically.
paths = ["packages/minisky", "packages/minisky-multicopter/src", "packages/tangram-minisky/src"]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://numpy.org/doc/stable/objects.inv",
  "https://fastapi.tiangolo.com/objects.inv",
  "https://abc8747.github.io/isqx/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
# Labels @command-decorated methods; mkdocstrings does not render decorators.
extensions = ["docs/griffe_stack_commands.py:StackCommands"]
docstring_style = "google"
docstring_section_style = "table"
show_source = true
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
# NOTE(abraham): minisky embeds invariants into types (via minisky.quantities, isqx,
# annotated-types) and so not all mod/class attributes necessarily have docstrings.
# ask mkdocstrings to show them regardless of whether it is documented.
show_if_no_docstring = true
show_attribute_values = true
# Not `members = true`: that selects every member and ignores the filters
# below, which would document private state and helpers as bare, prose-less
# blocks. Leaving members unset selects the same members but honours filters.
filters = ["!^_[^_]"]

[project.markdown_extensions.zensical.extensions.macros]
module_name = "docs/macros"
render_by_default = false
on_error_fail = true
on_undefined = "strict"

[project.markdown_extensions]
admonition = {}
attr_list = {}
"pymdownx.arithmatex" = { generic = true }
"pymdownx.details" = {}
"pymdownx.superfences" = {}
"pymdownx.highlight" = {}
"pymdownx.inlinehilite" = {}

[project.markdown_extensions."pymdownx.snippets"]
base_path = ["."]
check_paths = true
dedent_subsections = true

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true

[project.markdown_extensions.toc]
permalink = true
