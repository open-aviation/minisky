# Self-contained workspace for the tangram frontend plugin(s).
#
# This deliberately creates a `.venv` WITHIN this directory, separate from the
# repo-root `../.venv`. It is necessary for tools like ruff/pyright to properly
# locate `tangram_core` (a heavy, platform-specific wheel the rest of MiniSky
# does not depend on). Mirrors the layout of open-aviation/traffic's `tangram/`.
[project]
name = "tangram_workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[tool.uv.workspace]
members = ["tangram_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
include = ["tangram_minisky/src"]
exclude = ["**/__pycache__", "**/node_modules", "**/.venv"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
