[project]
name = "minisky-example"
version = "0.1.0"
description = "Example MiniSky plugin demonstrating runtime-owned state and commands"
readme = { text = "A private example plugin for MiniSky.", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = ["minisky>=0.1.0", "numpy>=2.2.2"]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minisky_example"]

[tool.uv.sources]
minisky = { workspace = true }

[project.entry-points."minisky.plugins"]
example = "minisky_example:init_plugin"
