[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minisky-xplane-navdata"
version = "0.0.1"
description = "X-Plane navigation data for MiniSky"
authors = [
    { name = "Abraham Cheung", email = "abraham@ylcheung.com" },
]
readme = "README.md"
license = "MIT AND GPL-2.0-or-later"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["minisky>=0.0.1", "numpy>=2.2.2", "polars>=1.0"]

[project.urls]
Documentation = "https://mode-s.org/minisky/user-guide/navdata/"
Repository = "https://github.com/open-aviation/minisky"
Issues = "https://github.com/open-aviation/minisky/issues"
Changelog = "https://github.com/open-aviation/minisky/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/minisky_xplane_navdata"]

[tool.uv.sources]
minisky = { workspace = true }
