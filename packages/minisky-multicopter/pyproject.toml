
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minisky-multicopter"
version = "0.0.1"
description = "MiniSky plugin flying small electric multirotors"
authors = [
    { name = "Andres Morfin Veytia" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["minisky>=0.0.2"]

[project.urls]
Documentation = "https://mode-s.org/minisky/user-guide/multicopters/"
Repository = "https://github.com/open-aviation/minisky"
Issues = "https://github.com/open-aviation/minisky/issues"
Changelog = "https://github.com/open-aviation/minisky/blob/main/CHANGELOG.md"

[project.entry-points."minisky.plugins"]
multicopter = "minisky_multicopter:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/minisky_multicopter"]

[tool.uv.sources]
minisky = { workspace = true }
