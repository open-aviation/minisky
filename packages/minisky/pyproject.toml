[project]
name = "minisky"
version = "0.0.1"
description = "An air traffic simulation library derived from BlueSky"
authors = [
    { name = "Joost Ellerbroek", email = "j.ellerbroek@tudelft.nl" },
    { name = "Jacco Hoekstra", email = "j.m.hoekstra@tudelft.nl" }
]
maintainers = [
    { name = "Abraham Cheung", email = "abraham@ylcheung.com" },
    { name = "Andres Morfin Veytia" }
]
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.15.0",
    "colorama>=0.4.6",
    "fastapi[standard]>=0.115.7",
    "numpy>=2.2.2",
    "openap>=2.4",
    "platformdirs>=4.3.6",
    "prompt-toolkit>=3.0.50",
    "requests>=2.32.3",
    "scipy>=1.15.1",
    "shapely>=2.0",
    "isqx>=0.1.2",
    "annotated-doc>=0.0.4",
]

[project.urls]
Documentation = "https://mode-s.org/minisky/"
Repository = "https://github.com/open-aviation/minisky"
Issues = "https://github.com/open-aviation/minisky/issues"
Changelog = "https://github.com/open-aviation/minisky/blob/main/CHANGELOG.md"

[project.scripts]
minisky = "minisky.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minisky"]
