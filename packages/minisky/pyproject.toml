[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minisky"
version = "0.0.1"
description = "An air traffic simulation library derived from BlueSky"
# BlueSky is written by Jacco M. Hoekstra and Joost Ellerbroek from TU Delft.
# minisky would not exist without their awesome work!
authors = [
    { name = "Abraham Cheung", email = "abraham@ylcheung.com" },
    { name = "Andres Morfin Veytia" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.2.2",
    "openap>=2.4",
    "platformdirs>=4.3.6",
    "pydantic>=2.0",
    "scipy>=1.15.1",
    "shapely>=2.0",
    "isqx>=0.1.2",
    "annotated-doc>=0.0.4",
]

[project.optional-dependencies]
cli = [
    # server
    "fastapi>=0.115.7",
    "python-multipart>=0.0.32",
    "uvicorn>=0.50.2",
    "websockets>=16.0",
    # client
    "httpx2>=2.0.0",
    "prompt-toolkit>=3.0.50",
    "typer>=0.15.0",
]

[project.urls]
Documentation = "https://mode-s.org/minisky/"
Repository = "https://github.com/open-aviation/minisky"
Issues = "https://github.com/open-aviation/minisky/issues"
Changelog = "https://github.com/open-aviation/minisky/blob/main/CHANGELOG.md"

[project.scripts]
minisky = "minisky.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["minisky"]
