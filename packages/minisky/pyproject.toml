[project]
name = "minisky"
version = "0.1.0"
description = "An air traffic simulation library derived from BlueSky"
readme = { text = "MiniSky is an air traffic simulation library derived from BlueSky.", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15.0",
    "colorama>=0.4.6",
    "fastapi[standard]>=0.115.7",
    "numpy>=2.2.2",
    "openap>=2.4",
    "pandas>=2.2.3",
    "platformdirs>=4.3.6",
    "prompt-toolkit>=3.0.50",
    "pyarrow>=19.0.1",
    "requests>=2.32.3",
    "scipy>=1.15.1",
    "shapely>=2.0",
    "isqx>=0.1.2",
    "annotated-doc>=0.0.4",
]

[project.scripts]
minisky = "minisky.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minisky"]
