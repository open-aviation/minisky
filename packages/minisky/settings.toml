asas_dtlookahead = 300 # ASAS lookahead time [sec]
asas_pzr = 5 # ASAS horizontal PZ margin [nm]
asas_pzh = 1000 # ASAS vertical PZ margin [ft]
asas_marh = 1.05 # ASAS protected zone factors - horizontal
asas_marv = 1.05 # ASAS protected zone factors - vertical

# A plugin table both enables the plugin at startup and supplies its config.
# --8<-- [start:configured-plugin]
[plugins.tangram]
redis_url = "redis://127.0.0.1:6379" # Redis used by the tangram deployment
channel = "minisky"                  # publishes to:<channel>:*, listens on from:<channel>:*
max_hz = 5                           # wall-clock cap on snapshot publish rate
# --8<-- [end:configured-plugin]
