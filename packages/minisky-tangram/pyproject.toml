[project]
name = "minisky-tangram"
version = "0.1.0"
description = "Example MiniSky plugin bridging simulator state to tangram over Redis"
readme = { text = "A private example plugin for MiniSky.", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = ["minisky>=0.1.0", "pydantic>=2.0", "redis>=5.0"]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minisky_tangram"]

[tool.uv.sources]
minisky = { workspace = true }

[project.entry-points."minisky.plugins"]
tangram = "minisky_tangram:init_plugin"
