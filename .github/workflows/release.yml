name: release

on:
  push:
    tags:
      - "minisky/*"
      - "minisky-xplane-navdata/*"
      - "minisky-multicopter/*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package: ${{ steps.release.outputs.package }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Prepare release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          package="${GITHUB_REF_NAME%%/*}"
          version="${GITHUB_REF_NAME#*/}"
          package_version="$(uv version --package "$package" --short)"

          if [[ "$version" != "$package_version" ]]; then
            echo "::error::tag version $version does not match $package version $package_version"
            exit 1
          fi

          mkdir -p release-bundle/dist
          uv run --no-project scripts/release_notes.py "$GITHUB_REF_NAME" > release-bundle/release-notes.md
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
        run: uv build --package "$PACKAGE" --out-dir release-bundle/dist

      - name: Store release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: release-bundle/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish ${{ needs.build.outputs.package }} to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.package }}/
    permissions:
      id-token: write # authenticate to PyPI with Trusted Publishing
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-bundle

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-bundle/dist/

  github-release:
    name: create GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload its assets
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-bundle

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          notes=(--notes "")
          if [[ -s release-bundle/release-notes.md ]]; then
            notes=(--notes-file release-bundle/release-notes.md)
          fi

          gh release create "$GITHUB_REF_NAME" release-bundle/dist/* \
            --verify-tag \
            --title "$PACKAGE $VERSION" \
            "${notes[@]}"
